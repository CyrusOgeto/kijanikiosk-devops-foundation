---
- name: Deploy MinIO to KijaniStaging Environment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Add MinIO Helm repository
      kubernetes.core.helm_repository:
        name: minio
        repo_url: https://charts.min.io/

    - name: Deploy MinIO to kijani-staging namespace
      kubernetes.core.helm:
        name: minio
        chart_ref: minio/minio
        release_namespace: kijani-staging
        wait: true
        values:
          rootUser: minioadmin
          rootPassword: minioadmin
          persistence:
            enabled: false
          service:
            type: ClusterIP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

    - name: Wait for MinIO pod to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: kijani-staging
        label_selectors:
          - app = minio
        wait: true
        wait_timeout: 120
        wait_condition:
          type: Ready
          status: "True"

    - name: Get MinIO pod name
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: kijani-staging
        label_selectors:
          - app = minio
      register: minio_pod

    - name: Create bucket using mc
      kubernetes.core.k8s_exec:
        namespace: kijani-staging
        pod: "{{ minio_pod.resources[0].metadata.name }}"
        command: |
          mc alias set minio http://minio:9000 minioadmin minioadmin
          mc mb minio/kk-payments-receipts-staging

    - name: Display MinIO service endpoint
      debug:
        msg: "MinIO is running. Access via kubectl port-forward -n kijani-staging svc/minio 9000:9000"

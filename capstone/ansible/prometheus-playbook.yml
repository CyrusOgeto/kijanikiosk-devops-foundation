---
- name: Install Prometheus in kijani-staging namespace
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Add Prometheus Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Deploy Prometheus to kijani-staging namespace
      kubernetes.core.helm:
        name: prometheus
        chart_ref: prometheus-community/prometheus
        release_namespace: kijani-staging
        wait: true
        values:
          alertmanager:
            enabled: false
          pushgateway:
            enabled: false
          server:
            persistentVolume:
              enabled: false
            configMapOverrideName: prometheus-config

    - name: Apply Prometheus ConfigMap with alert rules
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: prometheus-config
            namespace: kijani-staging
          data:
            alerts.yml: |
              groups:
                - name: kk-payments-alerts
                  interval: 30s
                  rules:
                    - alert: KKPaymentsHighErrorRate
                      expr: |
                        sum(rate(nginx_ingress_controller_requests{service="kk-payments", status=~"5.."}[2m])) 
                        / 
                        sum(rate(nginx_ingress_controller_requests{service="kk-payments"}[2m])) 
                        > 0.05
                      for: 2m
                      labels:
                        severity: warning
                      annotations:
                        summary: "High error rate for kk-payments"
                        description: "Error rate is {{ $value | humanizePercentage }} for kk-payments over the last 2 minutes."
                    - alert: KKPaymentsHighLatency
                      expr: |
                        histogram_quantile(0.95, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{service="kk-payments"}[2m])) by (le)) > 0.5
                      for: 2m
                      labels:
                        severity: warning
                      annotations:
                        summary: "High latency for kk-payments"
                        description: "95th percentile latency is {{ $value }}s for kk-payments over the last 2 minutes."
                    - alert: KKPaymentsPodRestarts
                      expr: |
                        rate(kube_pod_container_status_restarts_total{namespace="kijani-staging", pod=~"kk-payments.*"}[5m]) > 0.01
                      for: 2m
                      labels:
                        severity: warning
                      annotations:
                        summary: "kk-payments pods restarting frequently"
                        description: "Pod {{ $labels.pod }} is restarting at a rate of {{ $value }} restarts per second."
            prometheus.yml: |
              global:
                scrape_interval: 15s
                evaluation_interval: 15s

              alerting:
                alertmanagers:
                  - static_configs:
                      - targets: []

              rule_files:
                - /etc/config/alerts.yml

              scrape_configs:
                - job_name: 'kk-payments'
                  kubernetes_sd_configs:
                    - role: pod
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_pod_label_app]
                      action: keep
                      regex: kk-payments
                    - source_labels: [__meta_kubernetes_pod_container_port_number]
                      action: keep
                      regex: "3000"
                    - source_labels: [__meta_kubernetes_pod_ready]
                      action: keep
                      regex: "true"

    - name: Restart Prometheus pod to load new ConfigMap
      kubernetes.core.k8s:
        state: absent
        kind: Pod
        namespace: kijani-staging
        label_selectors:
          - app.kubernetes.io/name = prometheus

    - name: Wait for Prometheus pod to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: kijani-staging
        label_selectors:
          - app.kubernetes.io/name = prometheus
        wait: true
        wait_timeout: 120
        wait_condition:
          type: Ready
          status: "True"

    - name: Display Prometheus service endpoint
      debug:
        msg: "Prometheus is running. Access via kubectl port-forward -n kijani-staging svc/prometheus-server 9090:80"

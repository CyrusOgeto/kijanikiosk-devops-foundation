---
- name: Configure KijaniKiosk servers
  hosts: kijanikiosk
  become: yes
  gather_facts: yes
  
  tasks:
    # Phase 1: Packages
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - python3
          - python3-apt
          - ufw
          - systemd
          - logrotate
          - rsyslog
        state: present

    # Phase 2: Service Accounts
    - name: Create kk-payments user
      user:
        name: kk-payments
        state: present
        shell: /bin/bash
        create_home: yes

    # Phase 3: Directory Structure
    - name: Create application directories
      file:
        path: "/opt/kijanikiosk/{{ item }}"
        state: directory
        owner: kk-payments
        group: kk-payments
        mode: 0755
      loop:
        - config
        - logs
        - bin

    # Phase 4: Systemd Unit Files
    - name: Create kk-payments service file
      copy:
        dest: /etc/systemd/system/kk-payments.service
        content: |
          [Unit]
          Description=KijaniKiosk Payments Service
          After=network.target

          [Service]
          Type=simple
          User=kk-payments
          Group=kk-payments
          WorkingDirectory=/opt/kijanikiosk
          ExecStart=/opt/kijanikiosk/bin/payments-api
          Restart=always
          RestartSec=10

          # Hardening directives for security score < 2.5
          ProtectSystem=strict
          ReadWritePaths=/opt/kijanikiosk/config /opt/kijanikiosk/logs
          NoNewPrivileges=yes
          PrivateTmp=yes
          ProtectHome=yes
          ProtectKernelTunables=yes
          ProtectControlGroups=yes
          ProtectKernelModules=yes
          ProtectKernelLogs=yes
          PrivateDevices=yes
          ProtectClock=yes
          LockPersonality=yes
          MemoryDenyWriteExecute=yes
          RestrictRealtime=yes
          RestrictSUIDSGID=yes

          [Install]
          WantedBy=multi-user.target
        mode: 0644
      notify: restart kk-payments

    - name: Create placeholder payment script
      copy:
        dest: /opt/kijanikiosk/bin/payments-api
        content: |
          #!/bin/bash
          echo "KijaniKiosk Payments API is running..."
          while true; do
            echo "$(date): Payments service is healthy" >> /opt/kijanikiosk/logs/payments-api.log
            sleep 60
          done
        mode: 0755
        owner: kk-payments
        group: kk-payments

    - name: Enable and start kk-payments
      systemd:
        name: kk-payments
        enabled: yes
        state: started
      when: ansible_facts['os_family'] == "Debian"

    # Phase 5: Firewall Rules
    - name: Configure UFW firewall
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - 22
        - 8080
        - 8081
        - 9000

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    # Phase 6: Journal Persistence
    - name: Configure journald persistence
      lineinfile:
        path: /etc/systemd/journald.conf
        regexp: '^#?Storage='
        line: 'Storage=persistent'
      notify: restart journald

    # Phase 7: Logrotate
    - name: Configure logrotate for kk-payments
      copy:
        dest: /etc/logrotate.d/kk-payments
        content: |
          /opt/kijanikiosk/logs/*.log {
              daily
              rotate 7
              compress
              delaycompress
              missingok
              notifempty
              create 0640 kk-payments kk-payments
              postrotate
                  systemctl reload kk-payments > /dev/null 2>&1 || true
              endscript
          }
        mode: 0644

  handlers:
    - name: restart kk-payments
      systemd:
        name: kk-payments
        state: restarted

    - name: restart journald
      systemd:
        name: systemd-journald
        state: restarted
